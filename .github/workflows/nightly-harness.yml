name: Nightly Harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-and-aggregate:
    name: Governance And Aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run nightly governance and aggregate gates
        run: ./gradlew --no-daemon -Dktome.maintainability.blockingMode=false nightlyGovernanceGate

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-harness-${{ github.run_id }}
          path: |
            build/verification/verify-changed/**
            **/build/reports/phase4/**
            **/build/reports/verification/**
            **/build/reports/harness/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
