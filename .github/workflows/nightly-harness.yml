name: Nightly Harness

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long-run-lab:
    name: Long Run Lab
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run long-run lab
        run: ./gradlew --no-daemon longRunLab

      - name: Upload harness reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-harness-${{ github.run_id }}
          path: |
            **/build/reports/harness/**
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
