name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Build Changes
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}

    steps:
      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5

      - name: Detect bootstrap-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bootstrap:
              - "**/build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "scripts/bootstrap-deps.sh"
              - "scripts/verify-bootstrap.sh"

  check:
    name: Gradle Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run verification gates
        run: ./gradlew --no-daemon check

      - name: Upload Gradle reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  bootstrap-verify:
    name: Bootstrap Offline Verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore bootstrap download cache
        uses: actions/cache@v4
        with:
          path: .bootstrap/download-cache
          key: bootstrap-downloads-${{ runner.os }}-${{ hashFiles('build.gradle.kts', '**/build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/bootstrap-deps.sh') }}
          restore-keys: |
            bootstrap-downloads-${{ runner.os }}-

      - name: Run bootstrap offline verification
        run: ./scripts/verify-bootstrap.sh --clean

      - name: Upload bootstrap verification reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
