name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Build Changes
    runs-on: ubuntu-latest
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}

    steps:
      - name: Checkout repository
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v5

      - name: Detect bootstrap-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bootstrap:
              - "**/build.gradle.kts"
              - "settings.gradle.kts"
              - "gradle.properties"
              - "gradle/**"
              - "scripts/bootstrap-deps.sh"
              - "scripts/verify-bootstrap.sh"

  unit-and-tools:
    name: Unit And Tools
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run unit and tools gates
        run: ./gradlew --no-daemon unitAndToolsGate

      - name: Upload unit and tools reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-and-tools-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  game-harness:
    name: Game Harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run game harness gates
        run: ./gradlew --no-daemon gameHarnessGate

      - name: Upload game harness reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: game-harness-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  client-and-assets:
    name: Client And Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run client and asset gates
        run: ./gradlew --no-daemon clientAndAssetsGate

      - name: Upload client and asset reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-and-assets-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  check:
    name: Gradle Check
    needs:
      - unit-and-tools
      - game-harness
      - client-and-assets
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Evaluate parallel verification jobs
        env:
          UNIT_AND_TOOLS_RESULT: ${{ needs.unit-and-tools.result }}
          GAME_HARNESS_RESULT: ${{ needs.game-harness.result }}
          CLIENT_AND_ASSETS_RESULT: ${{ needs.client-and-assets.result }}
        run: |
          if [[ "$UNIT_AND_TOOLS_RESULT" != "success" || "$GAME_HARNESS_RESULT" != "success" || "$CLIENT_AND_ASSETS_RESULT" != "success" ]]; then
            echo "One or more parallel verification jobs failed."
            echo "unit-and-tools=$UNIT_AND_TOOLS_RESULT"
            echo "game-harness=$GAME_HARNESS_RESULT"
            echo "client-and-assets=$CLIENT_AND_ASSETS_RESULT"
            exit 1
          fi

  bootstrap-verify:
    name: Bootstrap Offline Verify
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore bootstrap download cache
        uses: actions/cache@v4
        with:
          path: .bootstrap/download-cache
          key: bootstrap-downloads-${{ runner.os }}-${{ hashFiles('build.gradle.kts', '**/build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', 'scripts/bootstrap-deps.sh') }}
          restore-keys: |
            bootstrap-downloads-${{ runner.os }}-

      - name: Run bootstrap offline verification
        id: bootstrap_verify
        continue-on-error: true
        run: ./scripts/verify-bootstrap.sh --clean

      - name: Warn on PR bootstrap verification failure
        if: github.event_name == 'pull_request' && steps.bootstrap_verify.outcome == 'failure'
        run: |
          echo "::warning::Bootstrap Offline Verify failed, but the job is non-blocking on pull requests. Inspect the uploaded bootstrap reports before merging build or dependency pipeline changes."

      - name: Fail bootstrap verification on main and manual runs
        if: github.event_name != 'pull_request' && steps.bootstrap_verify.outcome == 'failure'
        run: exit 1

      - name: Upload bootstrap verification reports
        if: steps.bootstrap_verify.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-reports-${{ github.run_id }}
          path: |
            **/build/reports/tests/**
            **/build/reports/jacoco/**
            **/build/reports/harness/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
