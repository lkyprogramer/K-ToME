name: Release Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-release-acceptance:
    name: Pre-Release Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run pre-release acceptance
        run: ./gradlew --no-daemon preReleaseAcceptance

      - name: Upload release acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-${{ github.run_id }}
          path: |
            build/reports/harness/**
            build/reports/jacoco/**
            core/build/reports/jacoco/**
            core/build/reports/tests/**
            game/build/reports/tests/**
            client/build/reports/tests/**
            client/build/release/**
          if-no-files-found: ignore
          retention-days: 14
