zoneMapgenProfiles:
  - id: zone_mapgen.greenwood_fringe.phase4.floor1
    zoneId: greenwood_fringe
    allowedBiomeFamilies: [forest, bog]
    loopCountRange: { start: 1, endInclusive: 2 }
    vaultPool: [vault.greenwood.briar_cache, vault.greenwood.smuggler_cache]
    terrainTagWeights:
      WATER: 0.24
      ICE: 0.12
    roomTagFilter: [forest, bog, sightline, bridge, hidden_cache, ambush]
    keyGatePlans:
      - id: gate.greenwood.final_path
        fromAnchorId: critical.hub
        toAnchorId: critical.goal
        grantedByAnchorId: optional.branch.1
        keyType: KEY_ITEM
        keyId: greenwood_final_path_key
    hiddenEntrancePlans:
      - bindingId: search.greenwood.hidden_cache
        sourceAnchorId: hidden.branch
        entranceAnchorId: hidden.branch
        targetAnchorId: secret.greenwood.hidden_cache
        targetSecretZoneId:
          registry: secret_zone
          id: greenwood_hidden_cache
        discoveryRule:
          combinator: AND
          predicates:
            - type: PERCEPTION_CHECK
              difficulty: 8
