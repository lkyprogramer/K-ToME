aiProfiles:
  - id: ai.chase.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: true
    defaultBehavior: CHASE
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: strike
        type: ATTACK_TARGET
        orderKey: 10
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: advance
        type: MOVE_TOWARD_TARGET
        orderKey: 20
        condition:
          type: TARGET_VISIBLE
  - id: ai.guard.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: false
    defaultBehavior: WAIT
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: strike
        type: ATTACK_TARGET
        orderKey: 10
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: hold_line
        type: MOVE_TOWARD_TARGET
        orderKey: 20
        condition:
