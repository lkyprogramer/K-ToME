      - id: close
        type: MOVE_TOWARD_TARGET
        orderKey: 20
        condition:
          type: TARGET_VISIBLE
  - id: ai.sentinel.rally
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: true
    defaultBehavior: PATROL
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: rally
        type: USE_ABILITY
        orderKey: 10
        abilityId: war_cry
        condition:
          type: AND
          conditions:
            - type: TARGET_VISIBLE
            - type: TALENT_READY
              talentId: war_cry
            - type: NOT
              condition:
                type: HAS_STATUS
                scope: SELF
                statusId: war_cry_empower
      - id: strike
        type: ATTACK_TARGET
        orderKey: 20
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: guard_line
        type: MOVE_TOWARD_TARGET
        orderKey: 30
        condition:
          type: TARGET_VISIBLE
