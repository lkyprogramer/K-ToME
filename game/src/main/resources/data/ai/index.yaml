  - id: ai.elite.huntmaster
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: true
    defaultBehavior: PATROL
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: finishing_strike
        type: USE_ABILITY
        orderKey: 10
        abilityId: power_strike
        condition:
          type: AND
          conditions:
            - type: HP_BELOW
              threshold: 0.5
            - type: TARGET_DISTANCE_LESS_THAN
              distance: 2
            - type: TALENT_READY
              talentId: power_strike
      - id: strike
        type: ATTACK_TARGET
        orderKey: 20
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: pursue
