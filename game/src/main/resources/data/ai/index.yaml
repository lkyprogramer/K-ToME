aiProfiles:
  - id: ai.chase.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: true
    defaultBehavior: CHASE
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: strike
        type: ATTACK_TARGET
        orderKey: 10
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: advance
        type: MOVE_TOWARD_TARGET
        orderKey: 20
        condition:
          type: TARGET_VISIBLE
  - id: ai.guard.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: false
    defaultBehavior: WAIT
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: strike
        type: ATTACK_TARGET
        orderKey: 10
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: hold_line
        type: MOVE_TOWARD_TARGET
        orderKey: 20
        condition:
          type: TARGET_VISIBLE
  - id: ai.kite.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: true
    defaultBehavior: KITE
    selectionPolicy: DETERMINISTIC_PRIORITY
    actions:
      - id: retreat
        type: RETREAT_FROM_TARGET
        orderKey: 10
        condition:
          type: TARGET_DISTANCE_LESS_THAN
          distance: 2
      - id: harry
        type: WAIT
        orderKey: 20
        condition:
          type: TARGET_DISTANCE_BETWEEN
          minDistance: 2
          maxDistance: 3
      - id: reposition
        type: MOVE_TOWARD_TARGET
        orderKey: 30
        condition:
          type: TARGET_VISIBLE
  - id: ai.patrol.basic
    schemaVersion: 2
    perceptionRange: 8
    useLastKnownPosition: false
    defaultBehavior: PATROL
    selectionPolicy: DETERMINISTIC_PRIORITY
