    schemaVersion: 2
    tags: [objective, official_slice]
    interactables: [supply_crate, alarm_bonfire, armory_gate]
    placements:
      - interactableId: supply_crate
        floor: 1
        anchor: player_start
        offset: { x: 1, y: 0 }
      - interactableId: alarm_bonfire
        floor: 1
        anchor: room_center
        offset: { x: 0, y: 0 }
