actionWeightProfiles:
  - id: boss.variant.weight.molten_glass
    actionWeights:
      earthshaker: 4.0
      linebreaker: 92.0
      strike: 2.0
      advance: 2.0
  - id: boss.variant.weight.grey_crown
    actionWeights:
      battlefield_command: 72.0
      shadow_bind: 10.0
      ritual_break: 58.0
      arcane_shield: 70.0
      close_quarters: 4.0
      press_forward: 3.0
  - id: boss.variant.weight.abyssal_eclipse
    actionWeights:
      void_breach: 2.0
      abyssal_consecration: 6.0
      linebreaker: 88.0
      relentless_strike: 4.0

bossVariants:
  - id: boss.variant.molten_glass
    baseEncounterId: molten_giant_encounter
    grantedMutations: [elite.ironhide, elite.emberblood]
    threatCost: 5
    lootProfileOverride: loot.deep_iron_pit.reward
    visualTintKey: vfx.boss.variant.molten_glass
    actionWeightProfileId: boss.variant.weight.molten_glass
    phaseOverrides:
      - phaseId: phase_enraged
        trigger:
          allOf:
            - ref: boss.trigger.hp_below_50
            - ref: zone.trigger.oil_or_fire_seen
        telegraphSpecId: molten_glass_phase_override_warning
        actionEmphasisIds: [linebreaker, earthshaker]
        onEnterEventKey: boss.variant.molten_glass.phase_override.entered

  - id: boss.variant.grey_crown
    baseEncounterId: dungeon_lord_encounter
    grantedMutations: [elite.dread_aura, elite.war_caller]
    threatCost: 6
    lootProfileOverride: loot.grey_gate_depths.reward
    visualTintKey: vfx.boss.variant.grey_crown
    actionWeightProfileId: boss.variant.weight.grey_crown
    phaseOverrides:
      - phaseId: phase_desperate
        trigger:
          allOf:
            - ref: boss.trigger.hp_below_45
            - ref: boss.trigger.war_caller_active
        telegraphSpecId: grey_crown_phase_override_warning
        actionEmphasisIds: [battlefield_command, ritual_break]
        onEnterEventKey: boss.variant.grey_crown.phase_override.entered

  - id: boss.variant.abyssal_eclipse
    baseEncounterId: abyssal_guardian_encounter
    grantedMutations: [elite.void_mirror, elite.phase_runner]
    threatCost: 8
    lootProfileOverride: loot.abyssal_heart.reward
    visualTintKey: vfx.boss.variant.abyssal_eclipse
    actionWeightProfileId: boss.variant.weight.abyssal_eclipse
    phaseOverrides:
      - phaseId: phase_abyssal
        trigger:
          allOf:
            - ref: boss.trigger.hp_below_40
            - ref: zone.trigger.void_pressure_active
        telegraphSpecId: abyssal_eclipse_phase_override_warning
        actionEmphasisIds: [void_breach, abyssal_consecration]
        onEnterEventKey: boss.variant.abyssal_eclipse.phase_override.entered
