events:
  - id: hidden.event.greenwood.hidden_cache.reveal
    triggerType: PERCEPTION_REVEAL
    optionalOnly: true
    conditions:
      - key: SEARCH_BINDING_ID
        expectedValue: search.greenwood.hidden_cache
    rewards:
      - key: REVEAL_SECRET_ZONE
        payload:
          bindingId: search.greenwood.hidden_cache
  - id: hidden.event.greenwood.hidden_cache.reward
    triggerType: INTERACT_TILE
    optionalOnly: true
    conditions:
      - key: SECRET_ZONE_ID
        expectedValue: greenwood_hidden_cache
    rewards:
      - key: LOOT_PROFILE
        payload:
          lootProfileRef:
            registry: loot_profile
            id: loot.greenwood_hidden_cache.secret
  - id: hidden.event.deep_iron.slag_cache.reveal
    triggerType: PERCEPTION_REVEAL
    optionalOnly: true
    conditions:
