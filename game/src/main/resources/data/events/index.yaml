      - key: REVEAL_SECRET_ZONE
        payload:
          bindingId: search.deep_iron.slag_cache
  - id: hidden.event.deep_iron.slag_cache.reward
    triggerType: INTERACT_TILE
    optionalOnly: true
    conditions:
      - key: SECRET_ZONE_ID
        expectedValue: deep_iron_slag_cache
    rewards:
      - key: GRANT_BUFF
        payload:
          statusRef:
            registry: status
            id: GUARD_STANCE_BUFF
          durationTurns: 5
          magnitude: 0.20
      - key: LOOT_PROFILE
        payload:
          lootProfileRef:
            registry: loot_profile
            id: loot.deep_iron_slag_cache.secret
  - id: hidden.event.underground_river.crystal_rift.reveal
