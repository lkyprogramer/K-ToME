stylePrompt: >-
  PR04 reference-crop evidence assets for the canonical Talent Assign panel.
  These assets are cropped from UI/dark-uiux-pr04-talent-assign-tree-icons-detail-reference.png
  to preserve visual fidelity for the PR04 golden scenario only. PR06 owns the
  formal full talent icon and tree icon rebaseline.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "reference-crop"
  negativeConstraints:
    - no generated replacement
    - no alternate style
    - no readable text
