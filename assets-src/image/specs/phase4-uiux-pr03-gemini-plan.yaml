styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  High fantasy, middle-earth inspired painterly UI companion pass for K-ToME
  Phase 4 UI/UX PR-03. These assets are formal UI anchors for empty states,
  shop cards, reward cards, and equipment category/profession identity. Keep
  silhouettes readable at 20-32 px, grounded in the existing K-ToME palette,
  never decorative background art, never anime, and never sci-fi.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
    - no letters, words, numbers, signage or readable UI text
    - no checkerboard transparency pattern
    - no full background scene
phase2AssetGates:
  P4-UIUX-PR03:
    description: Formal UI companion visual plan for PR-03 empty states, shared card headers, and equipment category/profession base icons.
    assets:
      - id: phase4_uiux_pr03_empty_inventory_icon
        category: icon
        visualKey: ui.empty.inventory.icon
        outputName: phase4/uiux_pr03/ui_empty_inventory_icon.png
        subject: empty inventory icon with an open worn satchel on a plain dark transparent-ready background, clear empty-space silhouette
        materialTags: [phase4, uiux, pr03, ui, empty_state, inventory]
        constraints: [ui-readable icon, clean centered silhouette, readable at sidebar row size, no checkerboard pattern]
        geminiKeyRequired: true
      - id: phase4_uiux_pr03_empty_shop_icon
