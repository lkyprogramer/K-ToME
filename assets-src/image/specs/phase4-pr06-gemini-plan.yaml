styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  High fantasy, middle-earth inspired painterly production pass for Phase 4 PR-06
  terrain interaction, elite mutation, and boss variant readability. Keep icons
  highly legible at small size, terrain decals readable on the tactical grid, and
  boss variant cues bold but still grounded in the established K-ToME palette,
  never anime and never sci-fi.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
