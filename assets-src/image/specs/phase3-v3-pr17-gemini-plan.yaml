styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >
  Classical high fantasy in a Middle-earth inspired painterly mode with readable
  silhouettes and old-world material weight. Never anime, never sci-fi, never neon,
  and never glossy futurism. Favor worn stone, black iron, broken sanctified metal,
  abyssal cracks, restrained holy glows, and gameplay-first clarity for zone cards,
  interactable props, and danger overlays.
defaults:
  imageAspectRatio: "1:1"
  imageSize: 1K
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
  categoryPromptTemplates:
    icon_quest: >
      Game quest or zone icon on transparent background. Single centered subject occupying
      65-75% of the canvas. Painterly, old-world materials, highly readable at small
      route-selection size with a strong silhouette and one dominant focal motif.
    portrait: >
      Game location card art with a focused environmental composition. Painterly, readable,
      atmospheric, and gameplay-facing rather than cinematic. Prioritize one memorable
      landmark silhouette and keep the scene grounded in worn stone, iron, void cracks,
      relic architecture, and restrained magical light.
    prop_interactable: >
      Game prop object on transparent background, slightly elevated 3/4 angle. Clear base
      footprint and obvious interaction affordance. Painterly, readable at small scale,
      with heavy use, age, and specific material story.
    tile_decal: >
      Gameplay-first tile overlay on transparent background. Hazard pattern only, no scenery.
      Painterly but abstract enough to composite over tiles. Readability and threat
      communication are more important than illustration detail.
