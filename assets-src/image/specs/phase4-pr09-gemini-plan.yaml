styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  High fantasy, middle-earth inspired painterly production pass for Phase 4
  PR-09 sample content pack visuals. The flooded reliquary pack must read as a
  formal player-facing content pack rather than a debug fixture: drowned stone,
  river glass, reliquary brass, and current-torn cloth should stay grounded in
  the established K-ToME palette and material language, never anime and never
  sci-fi.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
phase2AssetGates:
  P4-PR09:
    description: Formal PR-09 sample content-pack visual plan for flooded reliquary zone, prop, and item assets.
    assets:
      - id: phase4_pr09_zone_flooded_reliquary_visual
        category: portrait
        visualKey: sample_flooded_relics.zone.flooded_reliquary.visual
        outputName: phase4/pr09/zone_flooded_reliquary_visual.png
        subject: flooded reliquary portrait above the underground river with broken altars and suspended crystal silt
        materialTags: [phase4, pr09, sample_pack, zone, river, reliquary]
        constraints: [portrait composition, atmospheric but readable, hidden-route payoff]
        geminiKeyRequired: true
      - id: phase4_pr09_zone_flooded_reliquary_icon
        category: icon_quest
        visualKey: sample_flooded_relics.zone.flooded_reliquary.icon
        outputName: phase4/pr09/zone_flooded_reliquary_icon.png
        subject: flooded reliquary icon with river current ring and cracked votive glass
        materialTags: [phase4, pr09, sample_pack, zone, icon]
        constraints: [ui-readable icon, clean silhouette, clear secret-zone identity]
        geminiKeyRequired: true
      - id: phase4_pr09_prop_reliquary_node_visual
