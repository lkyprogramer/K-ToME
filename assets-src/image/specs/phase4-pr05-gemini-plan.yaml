styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  Classical high fantasy in a middle-earth inspired mode for K-ToME special loot item icons.
  Painterly concept-art finish with visible brushwork, weathered materials, bold silhouettes,
  and restrained color accents. Keep every icon readable at small size, never anime, and
  never sci-fi.
defaults:
  imageAspectRatio: '1:1'
  imageSize: 1K
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
