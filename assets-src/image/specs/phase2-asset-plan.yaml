styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >
  Classical high fantasy in a Middle-earth inspired mode: weathered stone, iron, leather,
  worn wood, muted natural pigments, sacred light and restrained arcane glow. Painterly,
  grounded, readable at small size, never anime, never sci-fi, never glossy mobile-game UI.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no cyberpunk lighting
    - no anime proportions
    - no floating text, watermark or logo
    - no busy background
