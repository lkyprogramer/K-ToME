styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  High fantasy, middle-earth inspired painterly production pass for Phase 4 OPT
  PR-02 elite mutation differentiation. Keep every mutation icon bold and
  readable at UI size, grounded in the established K-ToME palette, never anime,
  never sci-fi, and never overloaded with small decorative noise.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
phase2AssetGates:
