        visualKey: prop.hidden_entrance.revealed
        outputName: phase4/pr07/prop_hidden_entrance_revealed.png
        subject: revealed hidden entrance marker with carved stone seam and subtle light spill
        materialTags: [phase4, pr07, hidden, entrance]
        constraints: [grid-readable, single centered prop, readable at tactical size]
