styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >-
  High fantasy, middle-earth inspired painterly production pass for K-ToME Phase 4
  OPT PR-03 equipment passive expansion. Keep every affix and special loot image bold,
  readable at UI size, grounded in the established palette, never anime, and never sci-fi.
defaults:
  imageAspectRatio: "1:1"
  imageSize: "1K"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
phase2AssetGates:
