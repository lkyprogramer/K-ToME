        visualKey: item.healing_potion.icon
        outputName: phase2/p2-b/icon_item_minor_healing_potion.png
        subject: >
          A frontier healing potion for the official slice starter kit. Thick glass vial with a modest
          cork stopper, iron wire wrap, and deep crimson liquid that suggests reliable battlefield medicine
          rather than alchemical luxury. The bottle should feel sturdy, travel-worn, and practical.
        materialTags: [glass, iron, liquid]
        moodTags: [restorative, practical]
        constraints:
          - single potion object, centered, transparent background
          - clear readable silhouette at icon size
          - no glowing holy aura, no ornate jewelry treatment
        geminiKeyRequired: true
