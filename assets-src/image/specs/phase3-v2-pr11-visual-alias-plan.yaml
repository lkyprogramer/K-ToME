styleTag: ktome-middle-fantasy-painterly-tile-v1
artStyleBible: docs/2026-03-13-art-style-bible.md
stylePrompt: >
  Classical high fantasy in a Middle-earth inspired mode with painterly readable
  silhouettes. Never anime, never sci-fi. Focus on worn iron, leather, rune-carved
  steel, restrained elemental glow, and bold icon readability for gameplay-first
  combat skills.
defaults:
  imageAspectRatio: "1:1"
  imageSize: 1K
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
  categoryPromptTemplates:
    icon: >
      Game UI icon on transparent background. Single centered subject with bold
      silhouette and high readability at small size.
