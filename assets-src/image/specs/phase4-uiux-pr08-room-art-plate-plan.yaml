stylePrompt: >-
  High fantasy, middle-earth inspired painterly room art plate for K-ToME Phase 4
  UI/UX PR-08. This is a pre-rendered map-stage room surface, not a 128px tile,
  icon, prop, actor, or UI chrome frame. Preserve warm torch lighting, thick
  ruin walls, soft dark corners, irregular broken slab rhythm, and demoted
  tactical lattice. Never anime and never sci-fi.
defaults:
  imageAspectRatio: "4:3"
  imageSize: "1448x1086"
  negativeConstraints:
    - no modern clothing
    - no firearms
    - no sci-fi materials
    - no anime proportions
    - no floating text, watermark or logo
