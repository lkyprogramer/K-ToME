- sheetId: r01b-ui-shell-chrome
  round: 1
  type: large-sheet
  styleTag: ktome-dark-fantasy-sprite-ui-v1
  rawSheetPath: assets-src/image/raw/sheets/dark-v1/r01b-ui-shell-chrome.png
  outputRoot: client/src/main/resources
  promptBase: Dark fantasy roguelike demo shell chrome and navigation icon sheet, no text, transparent background
  grid:
    columns: 4
    rows: 4
    cellWidth: 256
    cellHeight: 256
  cells:
  - row: 0
    col: 0
    targetKey: ui.shell.outer_frame
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_outer_frame.png
    subject: forged iron full-screen shell frame with worn stone inset and subtle cyan rim light
  - row: 0
    col: 1
    targetKey: ui.shell.map_stage.frame
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_map_stage_frame.png
    subject: wide near-black map stage frame body with subtle smoky stone texture, restrained dark edge, no large ornament, no readable text, no brick wall
  - row: 0
    col: 2
    targetKey: ui.shell.nav_rail.frame
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_nav_rail_frame.png
    subject: narrow vertical navigation rail frame in black iron with worn rivets
  - row: 0
    col: 3
    targetKey: ui.shell.nav_button.active
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_nav_button_active.png
    subject: selected square nav button frame with restrained cyan focus edge and ember brass ticks
  - row: 1
    col: 0
    targetKey: ui.shell.hero_card.frame
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_hero_card_frame.png
    subject: bottom hero card frame with crest socket, dark stone face, and iron lower lip
  - row: 1
    col: 1
    targetKey: ui.shell.action_deck.frame
    category: ui_frame
    outputName: dark-v1/ui/ui_shell_action_deck_frame.png
    subject: horizontal action card deck frame with four evenly spaced heavy card sockets and ember dividers
  - row: 1
    col: 2
    targetKey: ui.shell.log_deck.frame
    category: ui_frame
